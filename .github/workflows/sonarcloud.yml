name: SonarCloud analysis

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  Analysis:
    runs-on: ubuntu-latest
    env:
      BUILD_WRAPPER_OUT_DIR: bw-output # Папка для логів враппера

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1. Встановлюємо Build Wrapper вручну (бо екшену немає)
      - name: Install Build Wrapper
        run: |
          curl -sSLo build-wrapper.zip https://sonarcloud.io/static/cpp/build-wrapper-linux-x86.zip
          unzip -o build-wrapper.zip

      # 2. Компілюємо код через враппер
      # УВАГА: ./build-wrapper-linux-x86/build-wrapper-linux-x86-64 — це шлях до скачаної утиліти
      - name: Build project
        run: |
          # ТУТ ВПИШИ СВОЮ КОМАНДУ КОМПІЛЯЦІЇ ЗАМІСТЬ g++ ...
          ./build-wrapper-linux-x86/build-wrapper-linux-x86-64 --out-dir ${{ env.BUILD_WRAPPER_OUT_DIR }} g++ *.cpp -o myapp

      # 3. Запускаємо аналізатор
      - name: Analyze with SonarCloud
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=RoshkoArtem_simple_math_lib
            -Dsonar.organization=roshkoartem
            -Dsonar.sources=.
            -Dsonar.cfamily.build-wrapper-output=${{ env.BUILD_WRAPPER_OUT_DIR }}
            -Dsonar.verbose=false
